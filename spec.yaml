# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: workload
displayName: agentenv
description: A shared shell with Claude Code, Codex and OpenCode.
dockerfile: ./Dockerfile
capabilities:
  - type: com.docker.sandbox/sbx@1
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - api.openai.com:443
          - auth.openai.com:443
          - chatgpt.com:443
          - api.anthropic.com:443
          - platform.claude.com:443
  - type: com.docker.sandbox/credential@1
    optional: true
    config:
      service: openai
      phase: runtime
      apiKey:
        name: OPENAI_API_KEY
        proxyManaged: true
        inject:
          - {domain: api.openai.com, header: Authorization, format: "Bearer %s"}
      oauth:
        tokenEndpoint: {host: auth.openai.com, path: /oauth/token}
        resourceHosts: [chatgpt.com]
        sentinels:
          accessToken: oai-oat01-proxy-managed
          refreshToken: oai-ort01-proxy-managed
        credentialFile:
          path: ~/.local/share/opencode/auth.json
          structure:
            openai:
              type: oauth
              access: "{{.AccessToken}}"
              refresh: "{{.RefreshToken}}"
              expires: "{{.ExpiresAt}}"
  - type: com.docker.sandbox/credential@1
    optional: true
    config:
      service: anthropic
      phase: runtime
      apiKey:
        name: ANTHROPIC_API_KEY
        inject:
          - {domain: api.anthropic.com, header: x-api-key, format: "%s"}
      oauth:
        tokenEndpoint: {host: platform.claude.com, path: /v1/oauth/token}
        sentinels:
          accessToken: sk-ant-oat01-proxy-managed
          refreshToken: sk-ant-ort01-proxy-managed
        credentialFile:
          path: ~/.claude/.credentials.json
          structure:
            claudeAiOauth:
              accessToken: "{{.AccessToken}}"
              refreshToken: "{{.RefreshToken}}"
              expiresAt: "{{.ExpiresAt}}"
              scopes: "{{.Scopes}}"
            primaryApiKey: "{{.PrimaryApiKey}}"
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: python3 /opt/agentenv/docker/sbx-auth.py
          user: agent
          env: [SBX_CRED_OPENAI_MODE, SBX_CRED_ANTHROPIC_MODE]
          description: Configure agent authentication for the bound host credentials
